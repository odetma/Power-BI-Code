name: Community Metadata Installer Checks

on:
  pull_request:
    paths:
      - 'scripts/pbip-metadata-installer/**'
      - '.github/workflows/pbip-metadata-installer-checks.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/pbip-metadata-installer/**'
      - '.github/workflows/pbip-metadata-installer-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test parser and service-link logic offline
        run: python -m unittest discover -s scripts/pbip-metadata-installer/payload/tests -v
      - name: Test installation and standalone package
        run: python -m unittest discover -s scripts/pbip-metadata-installer/tests -v
      - name: Build distributable ZIP
        if: runner.os == 'Linux'
        run: python scripts/pbip-metadata-installer/build_package.py --out distribution
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: pbip-metadata-installer-package
          path: distribution/
          if-no-files-found: error
          retention-days: 90
