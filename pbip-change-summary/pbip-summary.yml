name: PBIP Change Summary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.json"
      - "**/*.tmdl"
      - "**/*.m"
      - "**/*.pqm"
      - "**/*.pbip"
      - "**/.Report/**"
      - "**/.SemanticModel/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pbip-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}":"refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Resolve base branch tip
        id: base
        run: |
          BASE_SHA=$(git rev-parse "origin/${{ github.event.pull_request.base.ref }}")
          echo "Base SHA: $BASE_SHA"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Materialize base and head trees
        run: |
          mkdir -p .pbip-summary
          git worktree add .pbip-summary/base "${{ steps.base.outputs.sha }}"
          git worktree add .pbip-summary/head "${{ github.event.pull_request.head.sha }}"

      - name: Generate summary
        id: summary
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/pbip_change_reviewer.py \
            --old .pbip-summary/base \
            --new .pbip-summary/head \
            --output .pbip-summary/summary.md \
            --repo-url "$REPO_URL" \
            --head-sha "$HEAD_SHA" \
            --pr-number "$PR_NUMBER"
          echo "----- summary -----"
          cat .pbip-summary/summary.md
          echo "----- end -----"

          # Skip posting if nothing of substance changed (only the header).
          BODY_LINES=$(grep -c '^' .pbip-summary/summary.md || true)
          if [ "$BODY_LINES" -le 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update sticky PR comment
        if: steps.summary.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- pbip-change-summary-marker -->'
          BODY_FILE=.pbip-summary/comment-body.md
          {
            printf '%s\n\n' "$MARKER"
            cat .pbip-summary/summary.md
            printf '\n\n_Auto-generated by `.github/workflows/pbip-summary.yml`. Pushes to this PR refresh this comment._\n'
          } > "$BODY_FILE"

          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty")

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH \
              --field body=@"$BODY_FILE" >/dev/null
            echo "Updated sticky comment $COMMENT_ID"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$BODY_FILE"
            echo "Created sticky comment"
          fi